<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-gutter text-on-surface antialiased">
<!-- Transactional View - Nav Shell Suppressed -->
<main class="w-full max-w-[480px]">
<!-- Back Action (Contextual Departure) -->
<div class="mb-stack-lg">
<button class="flex items-center gap-2 text-on-surface-variant hover:text-on-surface transition-colors font-body-sm text-body-sm">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
                Back to Command Center
            </button>
</div>
<!-- Receipt Card -->
<div class="bg-surface-container-lowest rounded-2xl border border-outline-variant p-stack-lg shadow-[0_4px_12px_rgba(0,0,0,0.03),0_1px_2px_rgba(0,0,0,0.02)]">
<!-- Header -->
<div class="flex justify-between items-start mb-section-gap">
<div>
<h1 class="font-headline-md text-headline-md font-bold text-primary tracking-tight">Sedge</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Transaction Receipt</p>
</div>
<!-- Success Badge -->
<div class="bg-[#f0fdf4] text-[#166534] px-3 py-1 rounded-full flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">check_circle</span>
<span class="font-label-caps text-label-caps">Success</span>
</div>
</div>
<!-- Amount Focus -->
<div class="flex flex-col items-center justify-center mb-section-gap border-b border-outline-variant/30 pb-section-gap">
<span class="font-label-caps text-label-caps text-on-surface-variant mb-2">Amount Transferred</span>
<div class="flex items-baseline gap-2">
<span class="font-display-lg text-display-lg text-on-surface">500.00</span>
<span class="font-headline-md text-headline-md text-on-surface-variant">USDC</span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-2 flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">bolt</span>
                    Settled in 4s via Arbitrum
                </p>
</div>
<!-- Details List -->
<div class="flex flex-col gap-stack-md mb-section-gap">
<div class="flex justify-between items-center py-unit">
<span class="font-body-sm text-body-sm text-on-surface-variant">Date</span>
<span class="font-body-sm text-body-sm text-on-surface">Oct 24, 2023, 14:32 UTC</span>
</div>
<div class="flex justify-between items-center py-unit">
<span class="font-body-sm text-body-sm text-on-surface-variant">Receipt Number</span>
<span class="font-mono-data text-mono-data text-on-surface">#TXN-8A92F4</span>
</div>
<div class="flex justify-between items-center py-unit">
<span class="font-body-sm text-body-sm text-on-surface-variant">Sender</span>
<div class="flex items-center gap-2">
<span class="font-mono-data text-mono-data text-on-surface">0x1A2...3B4C</span>
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[16px]">content_copy</span>
</button>
</div>
</div>
<div class="flex justify-between items-center py-unit">
<span class="font-body-sm text-body-sm text-on-surface-variant">Recipient</span>
<div class="flex items-center gap-2">
<span class="font-mono-data text-mono-data text-on-surface">0x9F8...7E6D</span>
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[16px]">content_copy</span>
</button>
</div>
</div>
<div class="flex justify-between items-center py-unit">
<span class="font-body-sm text-body-sm text-on-surface-variant">Network Fee</span>
<span class="font-mono-data text-mono-data text-on-surface">$0.27</span>
</div>
</div>
<!-- Footer: Actions & QR -->
<div class="flex items-end justify-between border-t border-outline-variant/30 pt-stack-lg">
<div class="flex flex-col gap-stack-md">
<button class="bg-primary-container text-on-primary h-10 px-6 rounded-lg font-body-sm text-body-sm font-medium flex items-center justify-center gap-2 hover:opacity-90 transition-opacity">
<span class="material-symbols-outlined text-[18px]">download</span>
                        Download PDF
                    </button>
<button class="bg-surface-container-lowest text-on-surface border border-outline-variant h-10 px-6 rounded-lg font-body-sm text-body-sm font-medium flex items-center justify-center gap-2 hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-[18px]">ios_share</span>
                        Share Receipt
                    </button>
</div>
<div class="w-20 h-20 rounded-lg overflow-hidden border border-outline-variant p-1 bg-white">

</div>
</div>
</div>

<p class="text-center font-body-sm text-body-sm text-on-surface-variant mt-stack-lg">
            Secured by Sedge Protocol
        </p>
